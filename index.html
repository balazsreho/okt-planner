<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKT Planner</title>
    <meta name="theme-color" content="#1261b3" />
    <meta name="description" content="Mobile-friendly Orszagos Kektura route planner and stamp progress tracker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OKT Planner" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-pane" aria-label="Trail map planner">
        <div id="map"></div>

        <section class="elevation-dock" aria-label="Elevation profile">
          <div class="elevation-stats" aria-label="Selected route statistics">
            <div>
              <span class="stat-label">Selected</span>
              <strong id="selectedDistance">0.0 km</strong>
            </div>
            <div>
              <span class="stat-label">Forward</span>
              <strong id="selectedTime">0:00</strong>
            </div>
            <div>
              <span class="stat-label">Reverse est.</span>
              <strong id="selectedReturnTime">0:00</strong>
            </div>
            <div>
              <span class="stat-label">Up / Down</span>
              <strong id="selectedElevation">0 / 0 m</strong>
            </div>
          </div>
          <div class="elevation-chart-wrap">
            <div class="elevation-header">
              <span id="profileTitle">Select segments for elevation</span>
              <span id="profileMeta">Stats 2026-09-10</span>
            </div>
            <svg id="elevationChart" viewBox="0 0 900 170" role="img" aria-label="Elevation chart"></svg>
          </div>
        </section>
      </section>

      <aside class="side-pane" aria-label="Progress and stamp list">
        <div class="sheet-grabber" id="sheetGrabber" aria-hidden="true">
          <span></span>
        </div>
        <nav class="tabs" aria-label="Views">
          <button class="tab active" id="planTab" type="button">Plan</button>
          <button class="tab" id="progressTab" type="button">Progress</button>
        </nav>

        <div class="progress-summary">
          <div class="progress-ring" id="progressRing">0%</div>
          <div>
            <strong id="completedDistance">0.0 km completed</strong>
            <span id="remainingDistance">1183.1 km remaining</span>
          </div>
        </div>

        <section class="panel-view active" id="planView">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Segments</p>
              <h2>Choose a route</h2>
            </div>
            <div class="heading-actions">
              <button class="text-button" id="deselectButton" type="button">Deselect all</button>
            </div>
          </div>
          <div class="segment-list" id="segmentList"></div>
        </section>

        <section class="panel-view" id="progressView">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Stamps</p>
              <h2>Manual logbook</h2>
            </div>
            <button class="text-button" id="exportButton" type="button">Export</button>
          </div>

          <div class="stamp-list" id="stampList"></div>
        </section>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./okt-route-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
