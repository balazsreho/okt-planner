<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kékkör Planner</title>
    <meta name="theme-color" content="#1261b3" />
    <meta name="description" content="Mobile-friendly Kékkör route planner and stamp progress tracker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kékkör" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-pane" aria-label="Trail map planner">
        <div id="map"></div>

        <section class="elevation-dock" aria-label="Elevation profile">
          <div class="elevation-stats" aria-label="Selected route statistics">
            <div>
              <span class="stat-label">Selected</span>
              <strong id="selectedDistance">0.0 km</strong>
            </div>
            <div class="direction-stat" aria-label="Route direction">
              <span class="stat-label">Direction</span>
              <span class="direction-segmented">
                <button type="button" data-direction="forward" aria-pressed="true">W-E</button>
                <button type="button" data-direction="reverse" aria-pressed="false">E-W</button>
              </span>
            </div>
            <div>
              <span class="stat-label" id="selectedTimeLabel">Forward</span>
              <strong id="selectedTime">0:00</strong>
            </div>
            <div>
              <span class="stat-label" id="selectedReturnTimeLabel">Reverse est.</span>
              <strong id="selectedReturnTime">0:00</strong>
            </div>
            <div>
              <span class="stat-label">Up / Down</span>
              <strong id="selectedElevation">0 / 0 m</strong>
            </div>
          </div>
          <div class="elevation-chart-wrap">
            <div class="elevation-header">
              <span id="profileTitle">Select segments for elevation</span>
              <span id="profileMeta">Stats 2026-09-10</span>
            </div>
            <svg id="elevationChart" viewBox="0 0 900 170" role="img" aria-label="Elevation chart"></svg>
            <details class="travel-panel" id="travelPanel" aria-label="Public transport estimate">
              <summary>Travel from Budapest</summary>
              <div class="travel-controls">
                <label>
                  <span>Leave Budapest</span>
                  <input id="travelStartTime" type="datetime-local" />
                </label>
                <button class="travel-button" id="travelButton" type="button">Check travel</button>
              </div>
              <div class="travel-results" id="travelResults">
                Select a route to estimate public transport from Budapest.
              </div>
              <a class="travel-source" href="https://transitous.org/sources/" target="_blank" rel="noreferrer">
                Transit data by Transitous
              </a>
            </details>
          </div>
        </section>
      </section>

      <aside class="side-pane" aria-label="Progress and stamp list">
        <div class="sheet-grabber" id="sheetGrabber" aria-hidden="true">
          <span></span>
        </div>
        <nav class="trail-switcher" aria-label="Trail">
          <button class="trail-option active" type="button" data-trail="okt">OKT</button>
          <button class="trail-option" type="button" data-trail="ak">Alföld</button>
          <button class="trail-option" type="button" data-trail="rpddk">DDK</button>
        </nav>
        <nav class="tabs" aria-label="Views">
          <button class="tab active" id="planTab" type="button">Plan</button>
          <button class="tab" id="progressTab" type="button">Progress</button>
        </nav>

        <section class="panel-view active" id="planView">
          <div class="segment-list" id="segmentList"></div>
        </section>

        <section class="panel-view" id="progressView">
          <div class="progress-summary">
            <div class="progress-ring" id="progressRing">0%</div>
            <div>
              <strong id="completedDistance">0.0 km completed</strong>
              <span id="remainingDistance">1183.1 km remaining</span>
            </div>
          </div>
          <div class="stamp-list" id="stampList"></div>
        </section>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./trail-route-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
